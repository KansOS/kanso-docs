name: docmost-sync
# Copie l'espace Docmost « VT » (veille) dans veille/ sur main, chaque nuit et à la demande (onglet Actions › Run workflow).
# Sens unique, de Docmost vers Git : on écrit dans Docmost, jamais dans veille/ (le passage suivant l'écrase).
# Toutes les pages sont à plat dans veille/, leurs pièces jointes dans veille/assets/.
# main est protégée (PR obligatoire) : le bot pousse avec la clé de déploiement SYNC_DEPLOY_KEY, seule exception de la règle.

on:
  schedule:
    - cron: "0 23 * * *" # 00 h à Paris en hiver, 01 h en été : GitHub ne connaît que l'heure UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: docmost-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DOCMOST_URL: https://docs.kansos.org
      SPACE_SLUG: VT
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # toujours main, même lancé depuis une autre branche : seul veille/ part sur main
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Exporte l'espace depuis Docmost
        env:
          DOCMOST_EMAIL: ${{ secrets.DOCMOST_EMAIL }}
          DOCMOST_PASSWORD: ${{ secrets.DOCMOST_PASSWORD }}
        run: |
          set -euo pipefail
          EXPORT="$RUNNER_TEMP/export"
          jar=$(mktemp)
          api() { curl -sSf -b "$jar" -c "$jar" -H 'Content-Type: application/json' -d "$2" "$DOCMOST_URL/api/$1" "${@:3}"; }
          echo "Connexion à Docmost…"
          api auth/login "$(jq -n --arg e "$DOCMOST_EMAIL" --arg p "$DOCMOST_PASSWORD" '{email: $e, password: $p}')" -o /dev/null
          space=$(api spaces/ '{"limit": 100}' | jq -r --arg s "$SPACE_SLUG" '.data.items[] | select((.slug | ascii_downcase) == ($s | ascii_downcase)) | .id')
          [ -n "$space" ] || { echo "Espace $SPACE_SLUG introuvable pour ce compte."; exit 1; }
          echo "Espace $SPACE_SLUG trouvé."
          # Export page par page : exporter l'espace entier exige d'en être admin, une page se contente de la lecture.
          pages=$(api pages/sidebar-pages "$(jq -n --arg id "$space" '{spaceId: $id, limit: 100}')")
          [ "$(jq -r '.data.meta.hasNextPage' <<<"$pages")" = "false" ] || { echo "Plus de 100 pages racines : ajouter la pagination."; exit 1; }
          mkdir -p "$EXPORT"
          jq -c '.data.items[] | {id, title}' <<<"$pages" | while read -r p; do
            id=$(jq -r .id <<<"$p"); title=$(jq -r '.title // ""' <<<"$p" | tr '/' '-')
            echo "Export : $title"
            api pages/export "$(jq -n --arg id "$id" '{pageId: $id, format: "markdown", includeChildren: true, includeAttachments: true}')" -o "$RUNNER_TEMP/page.bin"
            # avec sous-pages ou pièces jointes : un zip ; sinon : le .md seul
            # Docmost range les pièces jointes sous un chemin absolu (/files/…) : unzip les remet sous $EXPORT et répond 1 (simple avertissement)
            if [ "$(head -c 2 "$RUNNER_TEMP/page.bin")" = "PK" ]; then unzip -qo "$RUNNER_TEMP/page.bin" -d "$EXPORT" || [ $? -eq 1 ]
            else mv "$RUNNER_TEMP/page.bin" "$EXPORT/${title:-sans-titre}.md"; fi
          done

      - name: Met les pages à plat
        run: |
          git rm -rq --ignore-unmatch -- veille
          python3 - "$RUNNER_TEMP/export" veille <<'PY'
          # Toutes les pages à la racine, toutes les pièces jointes dans assets/, liens réécrits en conséquence.
          import os, re, shutil, sys
          from urllib.parse import quote, unquote
          src, dst = sys.argv[1], sys.argv[2]
          os.makedirs(dst, exist_ok=True)
          pages, assets, taken = {}, {}, set()

          def unique(name, parent):
              if name in taken:
                  name = f"{parent} - {name}"  # ponytail: deux pages au même titre dans deux dossiers
              taken.add(name)
              return name

          for root, _, files in os.walk(src):
              for f in sorted(files):
                  if f == "docmost-metadata.json":  # contient l'heure d'export : un commit chaque nuit sinon
                      continue
                  path = os.path.join(root, f)
                  if f.endswith(".md"):
                      pages[path] = unique(f, os.path.basename(root))
                  else:
                      assets[path] = "assets/" + unique(f, os.path.basename(root))

          def relink(match, here):
              target = match.group(2)
              if re.match(r"^([a-z]+:|#)", target):
                  return match.group(0)
              path, _, anchor = target.partition("#")
              if path.startswith("/"):  # /files/… : relatif à la racine de l'export, comme unzip l'a extrait
                  here, path = src, path.lstrip("/")
              full = os.path.normpath(os.path.join(here, unquote(path)))
              new = assets.get(full) or pages.get(full)
              if not new:
                  return match.group(0)
              return match.group(1) + quote(new) + ("#" + anchor if anchor else "") + match.group(3)

          if assets:
              os.makedirs(os.path.join(dst, "assets"), exist_ok=True)
          for path, name in assets.items():
              shutil.copy2(path, os.path.join(dst, name))
          for path, name in pages.items():
              text = open(path, encoding="utf-8").read()
              text = re.sub(r"(\]\()([^)\s]+)(\))", lambda m: relink(m, os.path.dirname(path)), text)
              open(os.path.join(dst, name), "w", encoding="utf-8").write(text)
          print(f"{len(pages)} pages, {len(assets)} pièces jointes")
          PY

      - name: Commite s'il y a du nouveau
        run: |
          git add -A veille
          git diff --cached --quiet && { echo "Rien de nouveau dans Docmost."; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "docs: synchronise la veille depuis Docmost ($(date -u +%F))"
          git push origin HEAD:main
