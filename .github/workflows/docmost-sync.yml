name: docmost-sync
# Copie l'espace Docmost « VT » (veille) sur la branche « veille », chaque nuit et à la demande (onglet Actions › Run workflow).
# Sens unique, de Docmost vers Git : on écrit dans Docmost, jamais sur cette branche (le passage suivant l'écrase).
# Branche à part : main est protégée (PR et relecture obligatoires) et GitHub n'accorde pas d'exception à Actions.

on:
  schedule:
    - cron: "0 23 * * *" # 00 h à Paris en hiver, 01 h en été : GitHub ne connaît que l'heure UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: docmost-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DOCMOST_URL: https://docs.kansos.org
      SPACE_SLUG: VT
      DEST: veille
    steps:
      - uses: actions/checkout@v4

      - name: Se place sur la branche veille
        run: |
          if git fetch -q origin veille; then git checkout -q -B veille FETCH_HEAD
          else git checkout -q --orphan veille && git rm -rqf .; fi

      - name: Exporte l'espace depuis Docmost
        env:
          DOCMOST_EMAIL: ${{ secrets.DOCMOST_EMAIL }}
          DOCMOST_PASSWORD: ${{ secrets.DOCMOST_PASSWORD }}
        run: |
          set -euo pipefail
          jar=$(mktemp)
          api() { curl -sSf -b "$jar" -c "$jar" -H 'Content-Type: application/json' -d "$2" "$DOCMOST_URL/api/$1" "${@:3}"; }
          echo "Connexion à Docmost…"
          api auth/login "$(jq -n --arg e "$DOCMOST_EMAIL" --arg p "$DOCMOST_PASSWORD" '{email: $e, password: $p}')" -o /dev/null
          space=$(api spaces/ '{"limit": 100}' | jq -r --arg s "$SPACE_SLUG" '.data.items[] | select((.slug | ascii_downcase) == ($s | ascii_downcase)) | .id')
          [ -n "$space" ] || { echo "Espace $SPACE_SLUG introuvable pour ce compte."; exit 1; }
          echo "Espace $SPACE_SLUG trouvé."
          # Export page par page : exporter l'espace entier exige d'en être admin, une page se contente de la lecture.
          pages=$(api pages/sidebar-pages "$(jq -n --arg id "$space" '{spaceId: $id, limit: 100}')")
          [ "$(jq -r '.data.meta.hasNextPage' <<<"$pages")" = "false" ] || { echo "Plus de 100 pages racines : ajouter la pagination."; exit 1; }
          rm -rf "$DEST" && mkdir -p "$DEST"
          jq -c '.data.items[] | {id, title}' <<<"$pages" | while read -r p; do
            id=$(jq -r .id <<<"$p"); title=$(jq -r '.title // ""' <<<"$p" | tr '/' '-')
            echo "Export : $title"
            api pages/export "$(jq -n --arg id "$id" '{pageId: $id, format: "markdown", includeChildren: true, includeAttachments: true}')" -o page.bin
            # avec sous-pages ou pièces jointes : un zip ; sinon : le .md seul
            if [ "$(head -c 2 page.bin)" = "PK" ]; then unzip -qo page.bin -d "$DEST"; else mv page.bin "$DEST/${title:-sans-titre}.md"; fi
          done
          # l'heure d'export (exportedAt) change à chaque passage : sans ça, un commit chaque nuit même sans nouvelle page
          rm -f page.bin "$DEST/docmost-metadata.json"

      - name: Commite s'il y a du nouveau
        run: |
          git add -A "$DEST"
          git diff --cached --quiet && { echo "Rien de nouveau dans Docmost."; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "docs: synchronise la veille depuis Docmost ($(date -u +%F))"
          git push origin veille
